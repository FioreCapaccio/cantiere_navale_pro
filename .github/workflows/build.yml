name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test automatici
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  macos:
    name: DMG macOS (Apple Silicon)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build app
        run: ./build_mac.sh

      - name: Prepara DMG
        run: |
          STAGING=/tmp/cnav_build/dmg
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R /tmp/cnav_build/src/dist/CantiereNavalePro.app "$STAGING/"
          ln -s /Applications "$STAGING/Applicazioni"
          hdiutil create -volname "Cantiere Navale Pro" \
            -srcfolder "$STAGING" -ov -format UDZO \
            CantiereNavalePro-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: CantiereNavalePro-macOS
          path: CantiereNavalePro-macOS.dmg

  windows-portable:
    name: ZIP Windows (portabile)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build pacchetto
        run: ./build_windows.sh

      - name: Crea ZIP
        working-directory: /tmp/cnav_build/win_dist
        run: zip -qry CantiereNavalePro-Windows.zip CantiereNavalePro-Windows

      - uses: actions/upload-artifact@v4
        with:
          name: CantiereNavalePro-Windows
          path: /tmp/cnav_build/win_dist/CantiereNavalePro-Windows.zip

  windows-setup:
    name: Setup Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa dipendenze
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Genera icona
        run: python make_icon.py

      - name: PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --name CantiereNavalePro \
            --windowed \
            --clean \
            --noconfirm \
            --icon icon.ico \
            --add-data "static;static" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.http.h11_impl" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "jose.jwt" \
            --hidden-import "jose.jws" \
            --hidden-import "jose.backends" \
            main.py

      - name: Compila setup con Inno Setup
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$ISCC" ]; then
            choco install innosetup -y --no-progress
          fi
          if [ -n "${GITHUB_REF_NAME#v}" ] && [ "${GITHUB_REF_NAME}" != "${GITHUB_REF_NAME#v}" ]; then
            "$ISCC" /DAPP_VERSION="${GITHUB_REF_NAME#v}" installer.iss
          else
            "$ISCC" installer.iss
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CantiereNavalePro-Setup
          path: installer/CantiereNavalePro-Setup.exe

  release:
    name: Release (sui tag)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows-portable, windows-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crea Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --title "${GITHUB_REF_NAME}" --generate-notes
