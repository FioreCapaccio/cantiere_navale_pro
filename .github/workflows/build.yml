name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: DMG macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build app
        run: ./build_mac.sh

      - name: Prepara DMG
        run: |
          STAGING=/tmp/cnav_build/dmg
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R /tmp/cnav_build/src/dist/CantiereNavalePro.app "$STAGING/"
          ln -s /Applications "$STAGING/Applicazioni"
          hdiutil create -volname "Cantiere Navale Pro" \
            -srcfolder "$STAGING" -ov -format UDZO \
            CantiereNavalePro-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: CantiereNavalePro-macOS
          path: CantiereNavalePro-macOS.dmg

      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" CantiereNavalePro-macOS.dmg --title "${GITHUB_REF_NAME}" --generate-notes

  windows:
    name: ZIP Windows (portabile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build pacchetto
        run: ./build_windows.sh

      - name: Crea ZIP
        working-directory: /tmp/cnav_build/win_dist
        run: zip -qry CantiereNavalePro-Windows.zip CantiereNavalePro-Windows

      - uses: actions/upload-artifact@v4
        with:
          name: CantiereNavalePro-Windows
          path: /tmp/cnav_build/win_dist/CantiereNavalePro-Windows.zip

      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" /tmp/cnav_build/win_dist/CantiereNavalePro-Windows.zip --clobber
